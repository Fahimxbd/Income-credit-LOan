name: Validate Loan Rules Demo
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Python CLI smoke test
        run: |
          printf '1200000\n1100\n' | python credit.py | grep 'Meets both practice criteria'
          printf '900000\n900\n' | python loan_checker.py | grep 'Does not meet both practice criteria'
      - name: Browser logic tests
        run: node --test tests/*.test.mjs
      - name: Check Cloudflare Workers deploy package
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run
